version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgr
      POSTGRES_PASSWORD: ledgr
      POSTGRES_DB: ledgr
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://ledgr:ledgr@postgres:5432/ledgr
      REDIS_URL: redis://redis:6379

volumes:
  pg_data:
